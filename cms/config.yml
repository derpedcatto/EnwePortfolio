# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# sveltia cms icons: https://fonts.google.com/icons?icon.set=Material+Symbols&icon.platform=web

backend:
  name: github
  repo: derpedcatto/EnwePortfolio
  branch: main
  skip_ci: true

slug:
  encoding: ascii
  clean_accents: true

field_defaults:
  richtext:
    modes: [rich_text]
    editor_components: []
    buttons:
      [
        bold,
        italic,
        link,
        heading-two,
        heading-three,
        bulleted-list,
        numbered-list,
        quote,
      ]

media_libraries:
  all:
    slugify_filename: true
    max_file_size: 52428800 # 50 MB
    transformations:
      png:
        format: webp
        quality: 92
        width: 4096
        height: 4096
  cloudflare_r2: &r2
    account_id: d3d3d37b3ea59f639b515fa8b2c730c5
    bucket: enweportfolio
    access_key_id: de24be5494c9250daa07b729222ee36a
    public_url: https://media.annayaroshevych.com

collections:
  - name: categories
    label: Categories
    label_singular: Category
    folder: "content/taxonomies/categories"
    extension: yml
    format: yml
    reorder: true
    slug: "{{title}}"
    summary: "{{parent | ternary('   ↳ ', '')}}{{title}} {{hidden | ternary('- HIDDEN', '')}}"
    icon: category
    fields:
      - { name: title, label: Name, widget: string }

      - {
          name: hidden,
          label: Hidden,
          widget: boolean,
          default: false,
          hint: "**All projects under this category will become hidden as well.**",
        }

      - {
          name: personal,
          label: Personal,
          widget: boolean,
          default: false,
          hint: "Display category on personal website version only. **All projects under this category will not be displayed on normal website version.**",
        }

      - name: parent
        label: Parent category
        widget: relation
        collection: categories
        required: false
        dropdown_threshold: 0
        filters:
          - { field: slug, values: ["{{slug}}"], exclude: true }
          - { field: parent, values: [null, ""] }

  - name: tools
    label: Tools
    label_singular: Tool
    folder: content/taxonomies/tools
    extension: yml
    format: yml
    reorder: true
    summary: "{{title}}"
    icon: build
    fields:
      - {
          name: title,
          label: Name,
          widget: string,
          hint: "Will not be displayed on website if not used in any project.",
        }

  - name: tags
    label: Tags
    label_singular: Tag
    folder: content/taxonomies/tags
    extension: yml
    format: yml
    reorder: true
    summary: "{{title}}"
    icon: tag
    fields:
      - {
          name: title,
          label: Name,
          widget: string,
          hint: "Will not be displayed on website if not used in any project.",
        }

  - divider: true

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    extension: yml
    format: yml
    slug: "{{title}}"
    summary: "{{title}} ({{date | date('DD.MM.YYYY')}}) {{hidden | ternary('- HIDDEN', '')}}"
    icon: view_agenda
    sortable_fields:
      {
        fields: ["date", "title"],
        default: { field: date, direction: descending },
      }
    view_filters:
      - { label: Hidden, field: hidden, pattern: true }
      - { label: Public, field: hidden, pattern: false }
    view_groups:
      - { label: Year, field: date, pattern: '\d{4}' }
    fields:
      - name: title
        label: Title
        widget: string

      - name: hidden
        label: Hidden
        widget: boolean
        default: false

      - name: personal
        label: Personal
        widget: boolean
        default: false
        hint: "Display project on personal website version only."

      - name: date
        label: Date
        widget: datetime
        type: date
        default: "{{now}}"
        input_timezone: utc

      - name: display_date
        label: Display date on project page
        widget: boolean
        default: true

      - name: description
        label: Description
        widget: text
        hint: "Used in link previews (Telegram, LinkedIn, ...) and various other places. 1-2 sentences is enough."

      - name: category
        label: Category
        widget: relation
        collection: categories

      - name: tools
        label: Tools
        widget: relation
        collection: tools
        multiple: true
        required: false

      - name: tags
        label: Tags
        widget: relation
        collection: tags
        multiple: true
        required: false

      - name: links
        label: Links
        label_singular: Link
        widget: list
        required: false
        hint: "Will be displayed at top of the page. Order here = order on website."
        fields:
          - name: link
            label: Link
            widget: select
            default: custom
            options:
              - { label: ArtStation, value: artstation }
              - { label: Custom, value: custom }
          - {
              name: label,
              label: Label,
              widget: string,
              required: false,
              hint: "Leave empty to use the platform's default name.",
            }
          - { name: url, label: URL, type: url, widget: string }

      - name: thumbnail
        label: Thumbnail
        widget: image
        accept: "image/jpeg,image/png,image/webp"
        hint: "Square (1:1) image preferred."
        choose_url: false
        media_libraries:
          cloudflare_r2: { <<: *r2, prefix: "projects/{{slug}}/" }

      - name: thumbnail_hover
        label: Thumbnail (Hover)
        widget: file
        required: false
        accept: "image/jpeg,image/png,image/webp,video/mp4,video/webm"
        hint: "Square (1:1) image/video preferred. **Compress videos before uploading.**"
        choose_url: false
        media_libraries:
          cloudflare_r2: { <<: *r2, prefix: "projects/{{slug}}/" }

      - name: thumbnail_featured_slider
        label: Thumbnail (Featured Slider)
        widget: file
        required: false
        accept: "image/jpeg,image/png,image/webp,video/mp4,video/webm"
        hint: "Landscape (16:9) image/video preferred. **Compress videos before uploading.**"
        choose_url: false
        media_libraries:
          cloudflare_r2: { <<: *r2, prefix: "projects/{{slug}}/" }

      - name: blocks
        label: Content Blocks
        label_singular: Content Block
        widget: list
        collapsed: auto
        thumbnail: file
        hint: "Order here = Order on page."
        types:
          - name: text
            label: Text
            summary: "{{body | truncate(80)}}"
            fields:
              - name: body
                label: Text
                widget: richtext

          - name: media
            label: Media
            fields:
              - name: file
                label: Image/Video
                widget: file
                accept: "image/jpeg,image/png,image/webp,video/mp4,video/webm"
                hint: "**Compress videos before uploading.**"
                choose_url: false
                media_libraries:
                  cloudflare_r2: { <<: *r2, prefix: "projects/{{slug}}/" }
              - {
                  name: caption,
                  label: Caption,
                  widget: string,
                  required: false,
                }
              - {
                  name: alt,
                  label: "Alt text",
                  widget: string,
                  required: false,
                  hint: "Fill in for key media only. Describe what's shown (ex. 'Stylized sword, front view, glowing runes')",
                }
              - {
                  name: video_loop,
                  label: "[Video] Play silently on loop",
                  widget: boolean,
                  required: false,
                  default: true,
                }

          - name: slider
            label: Slider
            fields:
              - {
                  name: caption,
                  label: Caption,
                  widget: string,
                  required: false,
                }
              - name: slides
                label: Slides
                label_singular: Slide
                widget: list
                min: 1
                collapsed: auto
                thumbnail: file
                fields:
                  - name: file
                    label: Image/Video
                    widget: file
                    choose_url: false
                    accept: "image/jpeg,image/png,image/webp,video/mp4,video/webm"
                    hint: "**Compress videos before uploading.**"
                    media_libraries:
                      cloudflare_r2: { <<: *r2, prefix: "projects/{{slug}}/" }
                  - {
                      name: caption,
                      label: Caption,
                      widget: string,
                      required: false,
                    }
                  - {
                      name: alt,
                      label: "Alt text",
                      widget: string,
                      required: false,
                      hint: "Fill in for key media only. Describe what's shown (ex. 'Stylized sword, front view, glowing runes')",
                    }

          - name: youtube
            label: Youtube Link
            summary: "{{caption}}"
            fields:
              - name: url
                label: Video URL
                widget: string
                type: url
                pattern:
                  [
                    '^https://(www\.|m\.)?(youtube\.com/(watch\?(.*&)?v=|shorts/|embed/|live/)|youtu\.be/)[\w-]{11}',
                    "Paste a YouTube link to one video",
                  ]
              - {
                  name: loop,
                  label: "Play silently on loop",
                  widget: boolean,
                  default: false,
                  hint: "Autoplays muted and looped",
                }
              - {
                  name: caption,
                  label: Caption,
                  widget: string,
                  required: false,
                }

singletons:
  - name: selected_works
    label: Selected Works Page
    file: content/pages/selected-works.yml
    icon: home
    fields:
      - name: featured_slider
        label: Featured Slider
        widget: relation
        collection: projects
        filters:
          - { field: hidden, values: [false] }
          - { field: personal, values: [false] }
        multiple: true
        dropdown_threshold: 0
        required: true
        hint: "Order here = Slider order. Make sure that selected projects have `Thumbnail (Featured Slider)` media uploaded."

      - name: featured
        label: Featured
        widget: relation
        collection: projects
        filters:
          - { field: hidden, values: [false] }
          - { field: personal, values: [false] }
        multiple: true
        dropdown_threshold: 0
        hint: "Order here = Order on the page."

  - name: about
    label: About Page
    file: content/pages/about.yml
    icon: person
    fields:
      - name: avatar
        label: Avatar
        widget: image
        required: true
        hint: "Portrait (4:3) image preferred."
        choose_url: false
        media_libraries:
          cloudflare_r2: { <<: *r2, prefix: site/ }
      - { name: body, label: Body, widget: richtext }

  - divider: true

  - name: links
    label: Links
    file: content/site/links.yml
    icon: contact_page
    fields:
      - { name: email, label: Email, type: email, widget: string }
      - { name: telegram, label: Telegram, type: url, widget: string }
      - { name: linkedin, label: LinkedIn, type: url, widget: string }
      - { name: artstation, label: ArtStation, type: url, widget: string }

  - divider: true

  - name: settings
    label: Settings
    file: content/site/settings.yml
    icon: settings
    fields:
      - name: sorting
        label: Sorting
        widget: object
        collapsed: true
        fields:
          - {
              name: tools_alphabetical,
              label: "Tools: Sort alphabetically",
              widget: boolean,
              default: false,
              hint: "On = sort tools alphabetically. Off = use manual order set by dragging in Tools list.",
            }
          - {
              name: tags_alphabetical,
              label: "Tags: Sort alphabetically",
              widget: boolean,
              default: false,
              hint: "On = sort tags alphabetically. Off = use manual order set by dragging in Tags list.",
            }
