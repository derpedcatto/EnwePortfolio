# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# sveltia cms icons: https://fonts.google.com/icons?icon.set=Material+Symbols&icon.platform=web

backend:
  name: github
  repo: derpedcatto/EnwePortfolio
  branch: main
  skip_ci: true

slug:
  encoding: ascii
  clean_accents: true

field_defaults:
  richtext:
    modes: [rich_text]
    editor_components: []
    buttons:
      [
        bold,
        italic,
        link,
        heading-two,
        heading-three,
        bulleted-list,
        numbered-list,
        quote,
      ]

media_libraries:
  all:
    slugify_filename: true
    max_file_size: 52428800 # 50 MB
    transformations:
      png:
        format: webp
        quality: 100
        width: 4096
        height: 4096
      svg:
        optimize: true
  cloudflare_r2: &r2
    account_id: d3d3d37b3ea59f639b515fa8b2c730c5
    bucket: enweportfolio
    access_key_id: de24be5494c9250daa07b729222ee36a
    public_url: https://media.annayaroshevych.com

collections:
  - name: categories
    label: Categories
    label_singular: Category
    folder: "content/taxonomies/categories"
    extension: yml
    format: yml
    reorder: true
    slug: "{{title}}"
    summary: "{{parent | ternary('   ↳ ', '')}}{{title}}"
    icon: category
    fields:
      - {
          name: title,
          label: Name,
          widget: string,
          comment: "Category / sub-category name must be unique, no duplicates",
        }

      - name: parent
        label: Parent category
        widget: relation
        collection: categories
        required: false
        dropdown_threshold: 0
        hint: Don't add sub-category as parent, website supports only nesting depth of 1
        filters:
          - { field: slug, values: ["{{slug}}"], exclude: true }
          - { field: parent, values: [null, ""] }

  - name: tools
    label: Tools
    label_singular: Tool
    folder: content/taxonomies/tools
    extension: yml
    format: yml
    reorder: true
    summary: "{{title}}"
    icon: build
    fields:
      - {
          name: title,
          label: Name,
          widget: string,
          comment: "Tool name must be unique, no duplicates",
        }

  - name: tags
    label: Tags
    label_singular: Tag
    folder: content/taxonomies/tags
    extension: yml
    format: yml
    reorder: true
    summary: "{{title}}"
    icon: tag
    fields:
      - {
          name: title,
          label: Name,
          widget: string,
          comment: "Tag name must be unique, no duplicates",
        }

  - divider: true

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    extension: yml
    format: yml
    slug: "{{fields._slug}}"
    summary: "{{title}} ({{date | date('DD.MM.YYYY')}}) {{hidden | ternary('- HIDDEN', '')}}"
    icon: view_agenda
    sortable_fields:
      {
        fields: ["date", "title"],
        default: { field: date, direction: descending },
      }
    view_filters:
      - { label: Hidden, field: hidden, pattern: true }
      - { label: Public, field: hidden, pattern: false }
    view_groups:
      - { label: Year, field: date, pattern: '\d{4}' }
    fields:
      - name: title
        label: Title
        widget: string
        comment: "Project name must be unique, no duplicates"

      - name: hidden
        label: Hidden
        widget: boolean
        default: false
        hint: Hide from public website (will not be deleted),

      - name: date
        label: Date of creation/upload
        widget: datetime
        type: date
        default: "{{now}}"
        input_timezone: utc
        hint: Needed to sort projects by newest/oldest

      - name: summary
        label: Short summary
        widget: text
        required: false
        hint: Brief summary (1-2 sentences) for accessibility,

      - name: featured_project_slider_widget_text
        label: Featured Project slider widget text
        comment: Text that will be displayed on 'Featured Projects' slider card
        widget: string
        required: false

      - name: category
        label: Category
        widget: relation
        collection: categories

      - name: tools
        label: Tools
        widget: relation
        collection: tools
        multiple: true
        required: false

      - name: tags
        label: Tags
        widget: relation
        collection: tags
        multiple: true
        required: false

      - name: links
        label: External Links
        label_singular: External Link
        widget: list
        required: false
        summary: "{{platform}}: {{label}} {{url}}"
        fields:
          - name: platform
            label: Platform
            widget: select
            default: custom
            hint: Link type (only assigns platform icons near link name, nothing else)
            options:
              - { label: ArtStation, value: artstation }
              - { label: Custom, value: custom }
          - { name: label, label: Label, widget: string, required: false }
          - { name: url, label: URL, type: url, widget: string }

      - name: thumbnail
        label: Thumbnail
        widget: image
        comment: "Rename file to project name with image role (ex. `cursed-sword-thumb`)"
        hint: "Formats: PNG / JPG / WebP"
        choose_url: false
        media_libraries:
          cloudflare_r2: { <<: *r2, prefix: projects/ }

      - name: thumbnail_hover
        label: Thumbnail (Hover)
        widget: file
        required: false
        accept: "image/jpeg,image/png,image/webp,video/mp4,video/webm"
        comment: "Rename file to project name with image role (ex. `cursed-sword-hover`)"
        hint: "Shown when the cursor is over the card. Compress videos before uploading. Formats: PNG / JPG / WebP images, MP4 / Webm videos."
        choose_url: false
        media_libraries:
          cloudflare_r2: { <<: *r2, prefix: projects/ }

      - name: thumbnail_featured_projects_slider
        label: Thumbnail (Featured Projects slider)
        widget: image
        required: false
        comment: "Shown on 'Featured Projects' slider. Rename file to project name with image role (ex. `cursed-sword-thumb-slider`)"
        hint: "Wider image/video preferred. Compress videos before uploading. Formats: PNG / JPG / WebP images, MP4 / Webm videos."
        choose_url: false
        media_libraries:
          cloudflare_r2: { <<: *r2, prefix: projects/ }

      - name: blocks
        label: Content blocks
        label_singular: Content block
        widget: list
        required: false
        collapsed: auto
        thumbnail: file
        hint: Content blocks for the page. Drag to reorder
        types:
          - name: text
            label: Text
            summary: "{{body | truncate(80)}}"
            fields:
              - name: body
                label: Text
                widget: richtext

          - name: media
            label: Image or Video
            fields:
              - name: file
                label: Image or Video
                widget: file
                accept: "image/jpeg,image/png,image/webp,video/mp4,video/webm"
                comment: "Rename file to project name with image role, e.g. `cursed-sword-render-01`."
                hint: "Compress MP4/Webm video before upload. Formats: PNG / JPG / WebP images, MP4 / Webm videos."
                choose_url: false
                media_libraries:
                  cloudflare_r2: { <<: *r2, prefix: projects/ }
              - {
                  name: caption,
                  label: Caption,
                  widget: string,
                  required: false,
                  hint: Grey caption under media,
                }
              - {
                  name: alt,
                  label: Description (for accessibility),
                  widget: string,
                  required: false,
                  hint: (Do only for images),
                }
              - {
                  name: loop,
                  label: "Video: play silently on loop",
                  widget: boolean,
                  required: false,
                  default: true,
                }

          - name: slider
            label: Slider
            fields:
              - name: items
                label: Slides
                label_singular: Slide
                widget: list
                min: 1
                collapsed: auto
                thumbnail: image
                fields:
                  - name: image
                    label: Image
                    widget: image
                    choose_url: false
                    comment: "Rename file to project name with image role (ex. `cursed-sword-slide-01`)"
                    hint: "Formats: PNG / JPG / WebP"
                    media_libraries:
                      cloudflare_r2: { <<: *r2, prefix: projects/ }
                  - {
                      name: alt,
                      label: Description (for accessibility),
                      widget: string,
                      required: false,
                      hint: (Do only for images),
                    }
              - {
                  name: caption,
                  label: Caption,
                  widget: string,
                  required: false,
                  hint: Grey caption under the image,
                }

          - name: youtube
            label: Youtube Link
            summary: "{{caption}}"
            fields:
              - name: url
                label: Video URL
                widget: string
                type: url
                pattern:
                  [
                    '^https://(www\.|m\.)?(youtube\.com/(watch\?(.*&)?v=|shorts/|embed/|live/)|youtu\.be/)[\w-]{11}',
                    "Paste a YouTube link to one video",
                  ]
              - {
                  name: loop,
                  label: "Play silently on loop",
                  widget: boolean,
                  default: false,
                  hint: "Autoplays muted and looped",
                }
              - {
                  name: caption,
                  label: Caption,
                  widget: string,
                  required: false,
                  hint: Grey caption under the video,
                }

singletons:
  - name: selected_works
    label: Selected Works Page
    file: content/pages/selected-works.yml
    icon: home
    fields:
      - name: slider_projects
        label: Slider projects
        widget: relation
        collection: projects
        filters: [{ field: hidden, values: [false] }]
        multiple: true
        dropdown_threshold: 0
        required: true
        hint: Order here = slider order

      - name: featured_projects
        label: Featured projects
        widget: relation
        collection: projects
        filters: [{ field: hidden, values: [false] }]
        multiple: true
        dropdown_threshold: 0
        hint: Order here = order on the page

  - name: about
    label: About Page
    file: content/pages/about.yml
    icon: person
    fields:
      - name: avatar
        label: Avatar
        widget: image
        required: true
        comment: Portrait format preferred
        hint: "Formats: PNG / JPG / WebP"
        choose_url: false
        media_libraries:
          cloudflare_r2: { <<: *r2, prefix: site/ }
      - { name: body, label: Body, widget: richtext }

  - divider: true

  - name: contacts
    label: Contact & Socials
    file: content/site/contacts.yml
    icon: contact_page
    fields:
      - {
          name: email,
          label: Email,
          type: email,
          widget: string,
          required: true,
        }
      - name: socials
        label: Social Links
        label_singular: Social Link
        widget: list
        required: false
        fields:
          - name: platform
            label: Platform
            widget: select
            options:
              - { label: ArtStation, value: artstation }
              - { label: LinkedIn, value: linkedin }
              - { label: Telegram, value: telegram }
          - { name: url, label: URL, type: url, widget: string }

  - divider: true

  - name: settings
    label: Settings
    file: content/site/settings.yml
    icon: settings
    fields:
      - name: sorting
        label: Sorting
        widget: object
        collapsed: true
        fields:
          - {
              name: tools_alphabetical,
              label: "Tools: Sort alphabetically",
              widget: boolean,
              default: false,
              hint: "Off = use manual order set by dragging in Tools list. On = sort tools alphabetically",
            }
          - {
              name: tags_alphabetical,
              label: "Tags: Sort alphabetically",
              widget: boolean,
              default: false,
              hint: "Off = use manual order set by dragging in Tags list. On = sort tags alphabetically",
            }
